services:
  redis:
    image: redis:7-alpine
    container_name: tiktok4k-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - tiktok4k

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: tiktok4k-telegram-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
      TELEGRAM_WORK_DIR: /var/lib/telegram-bot-api
      TELEGRAM_TEMP_DIR: /tmp/telegram-bot-api
    volumes:
      - telegram-storage:/var/lib/telegram-bot-api
    networks:
      - tiktok4k

  telegram-cleanup:
    image: alpine:3.22
    container_name: tiktok4k-telegram-cleanup
    restart: unless-stopped
    volumes:
      - telegram-storage:/var/lib/telegram-bot-api
    command:
      - /bin/sh
      - -c
      - >-
        while true; do
          find /var/lib/telegram-bot-api -type f -path '*/documents/*'
          \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.mkv' -o -iname '*.avi' -o -iname '*.webm' \)
          -mmin +1440 -delete;
          sleep 3600;
        done
    networks:
      - tiktok4k

  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: tiktok4k-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
      LOCAL_API_URL: http://telegram-bot-api:8081
    ports:
      - "3000:3000"
    depends_on:
      - redis
      - telegram-bot-api
    networks:
      - tiktok4k

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: tiktok4k-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      LOCAL_API_URL: http://telegram-bot-api:8081
      REDIS_URL: redis://redis:6379
      TELEGRAM_SHARED_DIR: /var/lib/telegram-bot-api
    volumes:
      - telegram-storage:/var/lib/telegram-bot-api:ro
      - processing-temp:/app/temp
    command: ["npm", "run", "bot"]
    depends_on:
      - redis
      - telegram-bot-api
      - server
    networks:
      - tiktok4k

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: tiktok4k-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      LOCAL_API_URL: http://telegram-bot-api:8081
      REDIS_URL: redis://redis:6379
    volumes:
      - processing-temp:/app/temp
    command: ["npm", "run", "worker"]
    depends_on:
      - redis
      - telegram-bot-api
      - server
    networks:
      - tiktok4k

networks:
  tiktok4k:
    driver: bridge

volumes:
  redis-data:
  telegram-storage:
  processing-temp:
