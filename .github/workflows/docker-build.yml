name: Docker Build

on:
  push:
    branches:
      - main
      - feature/telegram-credit-system
  pull_request:
    branches:
      - main
      - feature/telegram-credit-system

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: |
          docker build \
            --build-arg VITE_API_URL=https://tiktok4k.example.com \
            -t tiktok4k:ci .
