name: Video Pipeline Tests

on:
  push:
    branches:
      - main
      - feature/telegram-credit-system
  pull_request:
    branches:
      - main
      - feature/telegram-credit-system
  workflow_dispatch:

jobs:
  video-pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Prepare FFmpeg paths
        run: |
          mkdir -p binaries/ffmpeg
          ln -sf "$(command -v ffmpeg)" binaries/ffmpeg/ffmpeg
          ln -sf "$(command -v ffprobe)" binaries/ffmpeg/ffprobe

      - name: Run video pipeline tests
        run: npx tsx src/video-pipeline.test.ts
