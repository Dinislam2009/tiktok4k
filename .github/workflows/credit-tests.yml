name: Credit Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/telegram-credit-system
  pull_request:
    branches:
      - main
      - feature/telegram-credit-system

jobs:
  credit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run credit lifecycle tests
        run: npx tsx src/credits.test.ts
